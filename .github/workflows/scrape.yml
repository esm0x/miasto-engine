name: Scrape data

# One job per city, so a dead source in one town cannot hold up another, then a single
# job that collects every city's files and commits them once. Committing from the
# matrix jobs directly would have N jobs racing to push to the same branch.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6h at :17 (off-peak minute)
  workflow_dispatch:
    inputs:
      city:
        description: 'Jedno miasto (slug), puste = wszystkie'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - 'cities/**'
      - '.github/workflows/scrape.yml'

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      cities: ${{ steps.list.outputs.cities }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: Cities with a sources.json
        # The input goes in through env, never pasted into the script: "${{ inputs.city }}"
        # inside run: is shell injection for anyone who can dispatch the workflow.
        env:
          CITY: ${{ inputs.city }}
        run: |
          if [ -n "$CITY" ]; then
            [[ "$CITY" =~ ^[a-z][a-z0-9]*$ ]] || { echo "invalid city slug"; exit 1; }
            test -f "cities/$CITY/sources.json" || { echo "no such city"; exit 1; }
            echo "cities=[\"$CITY\"]" >> "$GITHUB_OUTPUT"
          else
            list=$(for d in cities/*/; do d=${d%/}; [ -f "$d/sources.json" ] && basename "$d"; done | jq -R . | jq -sc .)
            echo "cities=$list" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        city: ${{ fromJson(needs.plan.outputs.cities) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Engine tests
        run: python -m unittest discover -s scraper/tests -t scraper

      # Every module, waste included, on every run. Waste used to be skipped by the cron
      # as "changes once a year", but the year itself changes on 1 January with nobody
      # pushing, and Rybnik's 16 PDFs take seconds. A module that fails turns this step
      # red but writes nothing, so the uploads below still carry every module that worked.
      - name: Build ${{ matrix.city }}
        env:
          CITY: ${{ matrix.city }}
        run: python scraper/build.py --city "$CITY"

      - name: Upload ${{ matrix.city }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.city }}
          # announcement.json is edited by hand in the repo and must never be overwritten.
          path: |
            data/${{ matrix.city }}/*.json
            data/${{ matrix.city }}/gtfs.zip
            !data/${{ matrix.city }}/announcement.json
          if-no-files-found: ignore
          retention-days: 3

      # What worked and what did not, for scraper/health.py in the commit job. Separate
      # from the data so the data artifact keeps its layout.
      - name: Upload ${{ matrix.city }} health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-${{ matrix.city }}
          path: data/_health/${{ matrix.city }}.json
          if-no-files-found: ignore
          retention-days: 3

  commit:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write          # health.py opens and closes "source down" issues
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          path: incoming

      - uses: actions/download-artifact@v4
        with:
          pattern: health-*
          path: incoming-health
          merge-multiple: true

      - name: Merge into data/
        run: |
          shopt -s nullglob
          for dir in incoming/data-*; do
            slug=${dir#incoming/data-}
            mkdir -p "data/$slug"
            cp "$dir"/* "data/$slug/"
          done

      # State across runs, STATUS.md, and an issue for a source down two runs in a row.
      # Needs only the standard library. Its own failure must not cost the data commit.
      - name: Source health
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/_health
          cp incoming-health/*.json data/_health/ 2>/dev/null || true
          python scraper/health.py --issues

      - name: Commit updated data (if changed)
        run: |
          git add data STATUS.md
          if git diff --cached --quiet -- data STATUS.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh scraped data"
          # Someone may have pushed (an announcement, a manual event) while we scraped.
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
